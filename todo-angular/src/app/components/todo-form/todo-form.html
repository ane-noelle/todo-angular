<form class="todo-form" (ngSubmit)="Submit()">
    <label class="sr-only" for="todo-title">Nova Tarefa</label>
    <input
      id="todo-title"
      name="title"
      type="text"
      placeholder="Digite uma tarefa"
      autocomplete="off"
      [(ngModel)]="title"
    />
    <button type="submit">Adicionar</button>
</form>
