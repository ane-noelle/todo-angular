@if (todos().leght === 0) {
    <p class="empty-message"> Nenhuma tarefa cadastrada.</p>
} @else {
    <ul class="todo-list">
        @for (todo of todos(); track todo.id) {
         <app-todo-item
            [todo]="todo"]
            (todoToggled)="todoToggled.emit($event)"
            (todoRemove)="todoRemove.emit($event)"
        />
      }
    </ul>
}
